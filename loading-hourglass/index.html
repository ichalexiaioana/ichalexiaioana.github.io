<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="animations.css">
    <title>Hourglass</title>
</head>
<body>
    <div id="hourglass-container">
        <div class="hourglass-top-bottom" id="hourglass-margin-top"></div>
        <div class="glass-square" id="glass-square-top"></div>
        <div class="glass-triangle" id="glass-triangle-top"></div>


        <!-- --------------------------------------------- -->

        <div id="sand-frame-1">
            <div id="sand-frame-1-top">
                <div id="sand-frame-1-top-square"></div>
                <div id="sand-frame-1-top-triangle"></div>
            </div>
        </div>
        
        <!-- --------------------------------------------- -->

        <div id="sand-frame-2">
            <div id="sand-frame-2-top">
                <div id="sand-frame-2-top-square"></div>
                <div id="sand-frame-2-top-triangle"></div>
                <div id="sand-frame-2-top-mask"></div>
            </div>
            <div id="sand-frame-2-bottom">
                <div id="sand-frame-2-bottom-triangle"></div>
            </div>
        </div>

        <!-- --------------------------------------------- -->
         
        <div id="sand-frame-3">
            <div id="sand-frame-3-top">
                <div id="sand-frame-3-top-square"></div>
                <div id="sand-frame-3-top-triangle"></div>
                <div id="sand-frame-3-top-mask"></div>
            </div>
            <div id="sand-frame-3-bottom">
                <div id="sand-frame-3-bottom-triangle"></div>
                <div id="sand-frame-3-bottom-square"></div>
            </div>
        </div>
        
        <!-- --------------------------------------------- -->
                  
        <div id="sand-frame-4">
            <div id="sand-frame-4-top">
                <div id="sand-frame-4-top-triangle"></div>
                <div id="sand-frame-4-top-mask"></div>
            </div>
            <div id="sand-frame-4-bottom">
                <div id="sand-frame-4-bottom-triangle"></div>
                <div id="sand-frame-4-bottom-square"></div>
            </div>
        </div>
        
        <!-- --------------------------------------------- -->

        <div id="sand-frame-5">
            <div id="sand-frame-5-bottom">
                <div id="sand-frame-5-bottom-square"></div>
                <div id="sand-frame-5-bottom-triangle"></div>
            </div>
        </div>

        <!-- --------------------------------------------- -->
         
        <div id="sand-frame-7">
            <div id="sand-frame-7-top">
                <div id="sand-frame-7-top-triangle"></div>
                <div id="sand-frame-7-top-mask"></div>
            </div>
            <div id="sand-frame-7-bottom">
                <div id="sand-frame-7-bottom-triangle"></div>
                <div id="sand-frame-7-bottom-square"></div>
            </div>
        </div>

        <!-- --------------------------------------------- -->

        <div id="sand-frame-8">
            <div id="sand-frame-8-top">
                <div id="sand-frame-8-top-square"></div>
                <div id="sand-frame-8-top-triangle"></div>
                <div id="sand-frame-8-top-mask"></div>
            </div>
            <div id="sand-frame-8-bottom">
                <div id="sand-frame-8-bottom-triangle"></div>
                <div id="sand-frame-8-bottom-square"></div>
            </div>
        </div>
        
        <!-- --------------------------------------------- -->
        
        <div id="sand-frame-9">
            <div id="sand-frame-9-top">
                <div id="sand-frame-9-top-square"></div>
                <div id="sand-frame-9-top-triangle"></div>
                <div id="sand-frame-9-top-mask"></div>
            </div>
            <div id="sand-frame-9-bottom">
                <div id="sand-frame-9-bottom-triangle"></div>
            </div>
        </div>

        <!-- --------------------------------------------- -->

        <div class="glass-triangle" id="glass-triangle-bottom"></div>
        <div class="glass-square" id="glass-square-bottom"></div>
        <div class="hourglass-top-bottom" id="hourglass-margin-bottom"></div>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
